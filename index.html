<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers Help Teachers</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 20px;
      margin-bottom: 30px;
    }

    #search {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 30px;
    }

    .resource {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .resource h2 {
      margin-top: 0;
    }

    .tag {
      display: inline-block;
      background: #eee;
      padding: 5px 10px;
      border-radius: 15px;
      margin-right: 5px;
      font-size: 14px;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      margin-right: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Teachers Help Teachers</h1>

  <p class="intro">
    Practical ideas, resources and innovations shared by teachers, for teachers.
  </p>

  <input
    type="text"
    id="search"
    placeholder="🔎 Search resources..."
    onkeyup="searchResources()"
  >

  <div id="resources">

    <div class="resource">
      <h2>☃️ Interactive Attendance Board</h2>

      <p>
        A fun interactive classroom resource created using Microsoft tools.
      </p>

      <span class="tag">Classroom Fun</span>
      <span class="tag">Microsoft</span>
      <span class="tag">Attendance</span>

      <br>

      <a href="AttendanceForInteractiveBoard.pptx">
        📊 PowerPoint
      </a>

      <a href="AttendanceSlidePrompt">
        ✨ Prompt
      </a>
    </div>

  </div>

  <script>
    function searchResources() {
      const search = document.getElementById("search").value.toLowerCase();
      const resources = document.querySelectorAll(".resource");

      resources.forEach(function(resource) {
        if (resource.innerText.toLowerCase().includes(search)) {
          resource.style.display = "block";
        } else {
          resource.style.display = "none";
        }
      });
    }
  </script>

</body>
</html>
